spring.application.name=BOOK_STORE
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=120MB
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=120MB

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gurukulam_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:@1?2&3#4}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Resend API Configuration
resend.api.key=${RESEND_API_KEY:your-key-here}
resend.api.sender=${RESEND_SENDER:onboarding@resend.dev}