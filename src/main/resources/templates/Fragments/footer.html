<footer th:fragment="footer">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

    <!-- Cross-Tab Logout Synchronization Script -->
    <script>
        // Listen for logout events from any other open tab
        window.addEventListener('storage', function(event) {
            if (event.key === 'gurukulam_logout_event') {
                window.location.href = '/login';
            }
        });

        // Broadcast logout event to all tabs when logout link is clicked
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('a[href$="/logout"]').forEach(function(link) {
                link.addEventListener('click', function() {
                    localStorage.setItem('gurukulam_logout_event', Date.now().toString());
                });
            });
        });

        // Handle page restoration from browser back-forward cache
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        });
    </script>
</footer>
