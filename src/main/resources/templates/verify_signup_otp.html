<!DOCTYPE html>
<html lang="en">
<head th:replace="Fragments/header :: header">
    <meta charset="UTF-8">
    <title>Verify Account Email</title>
</head>
<body>
    <nav th:replace="Fragments/login_navbar :: login_navbar"></nav>

    <div class="container">
        <div class="row">
            <div class="col">
                <div>
                    <img th:src="@{/Images/boy.png}" class="card-img" alt="">
                </div>
            </div>
            <div class="col d-flex justify-content-center align-items-center" style="margin-top: 100px;">
                <div class="container text-center" style="max-width: 400px">

                    <div style="font-family: Arial, Helvetica, sans-serif; font-size: large;">
                        <h2>Verify Your Email</h2>
                        <p class="text-muted">We sent a 6-digit verification code to your email. Enter it below to finish creating your account.</p>
                    </div>

                    <form th:action="@{/verify_signup_otp_process}" method="post" class="mt-4">
                        <input type="text" name="otp" placeholder="Enter 6-digit OTP" required
                               class="form-control mb-3 text-center fs-4 letter-spacing-2" maxlength="6" pattern="\d{6}">
                        <input type="submit" value="Verify & Create Account" class="btn btn-primary w-100 mb-4">
                    </form>

                    <hr class="w-100">
                    <a th:href="@{/sign}" style="text-decoration: none" class="d-block mb-2">Back to Sign Up</a>

                    <div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div>
                    <div class="alert alert-success mt-3" th:if="${message}" th:text="${message}"></div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="Fragments/footer :: footer"></footer>
</body>
</html>
