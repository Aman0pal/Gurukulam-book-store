    <!-- Broadcast Modal -->
    <div th:if="${session.role == 'admin' || session.role == 'owner'}" class="modal fade" id="broadcastModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="broadcastForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Broadcast Notice</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Target Audience</label>
                            <select class="form-select" name="target_audience" required>
                                <option value="ALL">Everyone (Users, Admins, & Owner)</option>
                                <option value="USER">Only Regular Users</option>
                                <option value="ADMIN">Only Admins</option>
                                <option value="OWNER">Only the Owner</option>
                            </select>
                        </div>
                        <div class="mb-3">

                        </div>

                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Send Broadcast</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Notifications Script -->
    <script th:if="${session.user != null}">
        document.addEventListener("DOMContentLoaded", function() {
            fetchNotifications();
            // Periodically check for new notifications every 30 seconds
            setInterval(fetchNotifications, 30000);
            
            const broadcastForm = document.getElementById("broadcastForm");
            if (broadcastForm) {
                broadcastForm.addEventListener("submit", function(e) {
                    e.preventDefault();
                    const formData = new FormData(broadcastForm);
                    fetch('/api/notifications/broadcast', {
                        method: 'POST',
                        body: formData
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') {
                            alert("Broadcast sent successfully!");
                            bootstrap.Modal.getInstance(document.getElementById("broadcastModal")).hide();
                            broadcastForm.reset();
                            fetchNotifications();
                        } else {
                            alert("Error: " + data.message);
                        }
                    });
                });
            }
        });

        let unreadCount = 0;

        function fetchNotifications() {
            fetch('/api/notifications')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById("notificationList");
                    const badge = document.getElementById("notifBadge");
                    list.innerHTML = "";
                    
                    if (data.length === 0) {
                        list.innerHTML = '<div class="p-3 text-center text-muted small">No notifications</div>';
                        badge.style.display = 'none';
                        return;
                    }

                    // Check local storage for read status to calculate unread badge
                    let lastReadId = localStorage.getItem('last_read_notif_id') || 0;
                    unreadCount = data.filter(n => n.id > lastReadId).length;
                    
                    if (unreadCount > 0) {
                        badge.textContent = unreadCount;
                        badge.style.display = 'block';
                    } else {
                        badge.style.display = 'none';
                    }

                    data.forEach(n => {
                        const dateObj = new Date(n.created_at);
                        const dateStr = dateObj.toLocaleString();
                        
                        list.innerHTML += `
                            <div class="dropdown-item p-3 border-bottom text-wrap" style="white-space: normal;">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="badge bg-primary">${n.topic}</span>
                                    <small class="text-muted" style="font-size: 0.7rem;">${dateStr}</small>
                                </div>
                                <div class="small fw-semibold text-dark mb-1">${n.message}</div>
                                <div class="text-muted" style="font-size: 0.75rem;">From: ${n.sender_name} (To: ${n.target_audience})</div>
                            </div>
                        `;
                    });
                });
        }

        function markNotificationsRead() {
            fetch('/api/notifications')
                .then(res => res.json())
                .then(data => {
                    if (data.length > 0) {
                        localStorage.setItem('last_read_notif_id', data[0].id);
                    }
                    const badge = document.getElementById("notifBadge");
                    if (badge) badge.style.display = 'none';
                });
        }
    </script>
