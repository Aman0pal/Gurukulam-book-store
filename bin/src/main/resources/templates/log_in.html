<!DOCTYPE html>
<html lang="en">
<head th:replace="Fragments/header :: header">
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <nav th:replace="Fragments/login_navbar :: login_navbar"></nav>
    <div class="container">
        <div class="row">
            <div class="col">
                <div>
                    <img th:src="@{/Images/boy.png}" class="card-img" alt="">
                </div>
            </div>
            <div class="col d-flex justify-content-center align-items-center" style="margin-top: 100px;">
                <div class="container text-center" style=" max-width: 400px">

                    <div style="font-family: Arial, Helvetica, sans-serif; font-size: large;">
                        <h2>Log in Gurukulam</h2>
                    </div>

                    <form th:action="@{/login}" method="post" class="mt-4">
                        <input type="text" name="email" placeholder="email or username" required
                               class="form-control mb-3 text-center">
                        <div class="position-relative mb-3">
                            <input type="password" name="password" id="loginPassword" placeholder="enter password" required
                                   class="form-control text-center pe-5" style="border-radius: 20px;">
                            <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer; color: #6c757d;" onclick="togglePassword('loginPassword', this)">
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </span>
                        </div>
                        <input type="submit" value="Log in" class="btn btn-primary w-100 mb-4">
                    </form>

                    <hr class="w-100">
                    <a th:href="@{/frgt_pass}" style="text-decoration: none" class="d-block mb-2">Forget password?</a>
                    <p>No Account <a th:href="@{/sign}" style="text-decoration: none">Create an account</a></p>

                    <div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div>
                    <div class="alert alert-success mt-3" th:if="${success}" th:text="${success}"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const eyeSvg = '<svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        const eyeSlashSvg = '<svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

        function togglePassword(inputId, span) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                span.innerHTML = eyeSlashSvg;
            } else {
                input.type = 'password';
                span.innerHTML = eyeSvg;
            }
        }
    </script>

    <footer th:replace="Fragments/footer :: footer"></footer>
</body>
</html>
